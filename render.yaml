# MEYON Demo Builder v2: isolated UAT preview on Render (free plan only).
# Creates two NEW services from branch v2/foundation. It does not touch the v1
# services (demo-builder-nonprod / demo-builder-ai-nonprod), which are not in this file.
# Secrets marked "sync: false" are entered in the Render dashboard, never in git.
services:
  - type: web
    name: demo-builder-v2-api
    runtime: node
    plan: free
    region: singapore            # closest Render region to the Supabase project (ap-northeast-2)
    branch: v2/foundation
    autoDeploy: false            # stable during UAT; redeploy manually when asked
    buildCommand: npm ci
    startCommand: node apps/api/src/main.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: DEMO_ACCESS_TOKEN        # generated by Render; read it in the dashboard to sign in to the studio
        generateValue: true
      - key: SUPABASE_URL
        value: https://cmmpmakaozsghampempl.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: MONTHLY_AI_BUDGET_USD    # hard cap for the UAT period
        value: "5"
      - key: MAX_SCREENS_PER_JOB
        value: "40"
      - key: STUDIO_HOST              # CORS: only the studio below may call the API
        fromService:
          type: web
          name: demo-builder-v2-studio
          property: host

  - type: web
    name: demo-builder-v2-studio
    runtime: static
    branch: v2/foundation
    autoDeploy: false
    buildCommand: npm ci && npm run build -w @demo/studio
    staticPublishPath: apps/studio/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_HOST
        fromService:
          type: web
          name: demo-builder-v2-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
